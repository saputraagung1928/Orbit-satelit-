<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saputra Agung 🌀</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f6fb;--card:#fff;--tx:#12182b;--mut:#5a6486;--ac:#3b5bff;--bd:#d8def0}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b18;--card:#0f1630;--tx:#e8ecff;--mut:#8f9bc7;--ac:#7c9cff;--bd:#222c55}}
:root[data-theme="dark"]{--bg:#070b18;--card:#0f1630;--tx:#e8ecff;--mut:#8f9bc7;--ac:#7c9cff;--bd:#222c55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:18px 16px 40px}
h1{margin:0;font-size:1.8rem}
.sub{color:var(--mut);margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:14px}
canvas{width:100%;height:auto;aspect-ratio:1/1;display:block;border-radius:10px;background:#050816}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:.85rem;color:var(--mut);display:block;margin-bottom:3px}
input{width:100%;padding:9px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:1rem}
.full{grid-column:1/-1}
button{margin-top:10px;padding:10px 16px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-size:1rem;font-weight:600}
.msg{color:#e0455a;font-size:.85rem;min-height:1.2em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.85rem}
td,th{padding:5px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
code{color:var(--ac)}
</style>
</head>
<body>
<main>
<h1>Saputra Agung 🌀</h1>
<p class="sub">Simulasi satelit mengorbit planet — gaya Starlink, bilangan bulat positif, string, dan machine learning mini.</p>

<div class="card">
<canvas id="c" width="700" height="700"></canvas>
</div>

<div class="card">
<div class="row">
<div><label>Jumlah satelit (bilangan bulat positif)</label><input id="n" type="number" min="1" step="1" value="7"></div>
<div><label>Jarak orbit dasar (km di atas planet, bilangan bulat)</label><input id="d" type="number" min="1" step="1" value="550"></div>
<div class="full"><label>String (tiap karakter menggeser orbit satelit)</label><input id="s" type="text" value="Starlink"></div>
</div>
<div class="msg" id="m"></div>
<button id="go">Luncurkan 🚀</button>
</div>

<div class="card">
<b>🤖 Machine learning (regresi linear)</b>
<p class="sub" style="margin-top:4px">Model belajar hukum Kepler dari data orbit bernoise: <code>log T = w·log r + b</code>. Nilai ideal w = 1,5.</p>
<div id="ml">Melatih…</div>
<label style="margin-top:8px">Prediksi periode untuk ketinggian (km)</label>
<input id="p" type="number" min="1" step="1" value="550">
<div id="pr" style="margin-top:6px"></div>
</div>

<div class="card scroll"><b>Daftar satelit</b><table id="t"></table></div>
</main>
<script>
const R=6371, MU=398600.4418;
const cv=document.getElementById('c'), cx=cv.getContext('2d');
let sats=[];

function period(r){return 2*Math.PI*Math.sqrt(r**3/MU)}

// ---- ML: linear regression by gradient descent ----
let W=0,B=0;
function train(){
  const X=[],Y=[];
  for(let i=0;i<200;i++){
    const r=R+200+Math.random()*35000, T=period(r)*(1+(Math.random()-.5)*.04);
    X.push(Math.log(r));Y.push(Math.log(T));
  }
  const mx=X.reduce((a,b)=>a+b)/X.length, my=Y.reduce((a,b)=>a+b)/Y.length;
  let w=0,b=0;const lr=.1;
  for(let e=0;e<3000;e++){
    let gw=0,gb=0;
    for(let i=0;i<X.length;i++){const x=X[i]-mx,y=Y[i]-my,err=w*x+b-y;gw+=err*x;gb+=err}
    w-=lr*gw/X.length;b-=lr*gb/X.length;
  }
  W=w;B=my-w*mx+b;
  document.getElementById('ml').innerHTML=`Hasil belajar: w = <b>${W.toFixed(3)}</b>, b = <b>${B.toFixed(3)}</b> (200 data, 3000 iterasi)`;
  predict();
}
function predict(){
  const h=parseInt(document.getElementById('p').value);
  const el=document.getElementById('pr');
  if(!(h>0)){el.textContent='Masukkan bilangan bulat positif.';return}
  const r=R+h, T=Math.exp(W*Math.log(r)+B)/60, real=period(r)/60;
  el.innerHTML=`Prediksi: <b>${T.toFixed(1)} menit</b> · rumus Kepler: ${real.toFixed(1)} menit`;
}

// ---- Simulasi ----
function build(){
  const m=document.getElementById('m');
  const n=parseInt(document.getElementById('n').value), d=parseInt(document.getElementById('d').value);
  const s=document.getElementById('s').value||'S';
  if(!(n>0)||!(d>0)||!Number.isInteger(+document.getElementById('n').value)||!Number.isInteger(+document.getElementById('d').value)){
    m.textContent='Jumlah satelit dan jarak harus bilangan bulat positif.';return}
  if(n>200){m.textContent='Maksimal 200 satelit.';return}
  m.textContent='';
  sats=[];
  for(let i=0;i<n;i++){
    const ch=s.charCodeAt(i%s.length);
    const alt=d+(ch%40)*10+i*5;
    sats.push({name:s[i%s.length]+(i+1),alt,r:R+alt,a:i/n*Math.PI*2,T:period(R+alt),ch});
  }
  const t=document.getElementById('t');
  t.innerHTML='<tr><th>Nama</th><th>Kode</th><th>Alt (km)</th><th>Periode (mnt)</th></tr>'+
    sats.slice(0,30).map(x=>`<tr><td>${x.name}</td><td>${x.ch}</td><td>${x.alt}</td><td>${(x.T/60).toFixed(1)}</td></tr>`).join('');
}

let last=performance.now();
function frame(now){
  const dt=(now-last)/1000;last=now;
  const W2=cv.width,c=W2/2;
  cx.clearRect(0,0,W2,W2);
  const maxR=Math.max(...sats.map(x=>x.r),R*1.3);
  const k=(c-30)/maxR;
  const g=cx.createRadialGradient(c-20,c-20,10,c,c,R*k);
  g.addColorStop(0,'#5fb3ff');g.addColorStop(1,'#1b3a8a');
  cx.fillStyle=g;cx.beginPath();cx.arc(c,c,R*k,0,7);cx.fill();
  for(const s of sats){
    s.a+=dt*(2*Math.PI/s.T)*600;
    cx.strokeStyle='rgba(140,160,255,.15)';cx.beginPath();cx.arc(c,c,s.r*k,0,7);cx.stroke();
    const x=c+Math.cos(s.a)*s.r*k,y=c+Math.sin(s.a)*s.r*k;
    cx.fillStyle='#fff';cx.fillRect(x-3,y-3,6,6);
    if(sats.length<=20){cx.fillStyle='#9fb0ff';cx.font='16px sans-serif';cx.fillText(s.name,x+6,y-6)}
  }
  requestAnimationFrame(frame);
}
document.getElementById('go').onclick=build;
document.getElementById('p').oninput=predict;
build();train();requestAnimationFrame(frame);
</script>
</body>
</html>
